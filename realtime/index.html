<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>lingbot-map realtime</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #111; color: #eee; font: 14px/1.4 system-ui, sans-serif; }
  header { padding: 8px 12px; background: #000; border-bottom: 1px solid #333; }
  header h1 { font-size: 14px; margin: 0; opacity: 0.7; }
  main { padding: 8px; }
  video { width: 100%; max-width: 100%; background: #000; border-radius: 8px; }
  .row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; align-items: center; }
  button { padding: 12px 16px; font-size: 16px; border: 0; border-radius: 6px; background: #2566ff; color: #fff; }
  button:disabled { background: #555; opacity: 0.7; }
  button.stop { background: #d62828; }
  select { padding: 8px; font-size: 14px; background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; }
  pre { background: #000; border: 1px solid #333; padding: 8px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; font-size: 12px; max-height: 240px; overflow-y: auto; }
  .stats { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
  .stats b { opacity: 0.7; font-weight: normal; }
  .badge { padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  .badge.ok { background: #2a7a2a; }
  .badge.bad { background: #7a2a2a; }
  .badge.idle { background: #555; }
  .badge.wait { background: #7a6a2a; }
</style>
</head>
<body>
<header><h1>lingbot-map — phase 1 webrtc test</h1></header>
<main>
  <video id="local" autoplay playsinline muted></video>
  <div class="row">
    <select id="camera"></select>
    <select id="res">
      <option value="640x480">640×480</option>
      <option value="1280x720" selected>1280×720</option>
      <option value="1920x1080">1920×1080</option>
    </select>
  </div>
  <div class="row">
    <button id="start">시작</button>
    <button id="stop" class="stop" disabled>중지</button>
    <button id="reload" style="background:#444">리로드</button>
    <span id="conn" class="badge idle">idle</span>
  </div>
  <div class="stats">
    <b>local track</b><span id="t_local">—</span>
    <b>server frames</b><span id="s_frames">—</span>
    <b>server fps</b><span id="s_fps">—</span>
    <b>last shape</b><span id="s_shape">—</span>
    <b>elapsed</b><span id="s_elapsed">—</span>
  </div>
  <h3>log</h3>
  <pre id="log"></pre>
</main>

<script>
const $ = id => document.getElementById(id);
const logEl = $('log');
function log(...a) {
  const msg = a.map(x => typeof x === 'object' ? JSON.stringify(x) : String(x)).join(' ');
  const ts = new Date().toLocaleTimeString();
  logEl.textContent = `[${ts}] ${msg}\n` + logEl.textContent;
  console.log(...a);
}
function setConn(s, cls='idle') {
  $('conn').textContent = s;
  $('conn').className = 'badge ' + cls;
}
function resetButtons() {
  $('start').disabled = false;
  $('stop').disabled = true;
}
window.addEventListener('error', e => log('window error:', e.message));
window.addEventListener('unhandledrejection', e => log('unhandled rejection:', e.reason?.message || e.reason));
$('reload').onclick = () => location.reload();

let pc = null, localStream = null, dc = null;

async function listCameras() {
  // Without prior permission we won't get device labels — that's OK, drop down still works.
  try {
    const devs = await navigator.mediaDevices.enumerateDevices();
    const sel = $('camera');
    sel.innerHTML = '';
    const cams = devs.filter(d => d.kind === 'videoinput');
    if (cams.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '(권한 허용 후 다시 표시)';
      sel.appendChild(opt);
    }
    cams.forEach((d, i) => {
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.textContent = d.label || `Camera ${i+1}`;
      if (/back|rear|환경|후면/i.test(d.label)) opt.selected = true;
      sel.appendChild(opt);
    });
    log('cameras found:', cams.length);
  } catch (e) {
    log('enumerateDevices error:', e.message);
  }
}
listCameras();

$('start').onclick = start;
$('stop').onclick = stop;

async function start() {
  $('start').disabled = true;
  setConn('camera…', 'wait');
  const [w, h] = $('res').value.split('x').map(Number);
  const deviceId = $('camera').value || undefined;

  try {
    const constraints = {
      video: {
        deviceId: deviceId ? {exact: deviceId} : undefined,
        width: {ideal: w}, height: {ideal: h},
        facingMode: deviceId ? undefined : {ideal: 'environment'},
      },
      audio: false,
    };
    log('requesting camera:', JSON.stringify(constraints.video));
    localStream = await navigator.mediaDevices.getUserMedia(constraints);
  } catch (e) {
    log('getUserMedia error:', e.name, e.message);
    setConn('camera denied', 'bad');
    resetButtons();
    return;
  }
  $('local').srcObject = localStream;
  const vt = localStream.getVideoTracks()[0];
  const settings = vt.getSettings();
  $('t_local').textContent = `${settings.width}×${settings.height} @ ${settings.frameRate||'?'}fps`;
  log('camera ok:', $('t_local').textContent);
  // refresh camera list now that we have permission/labels
  listCameras();

  try {
    setConn('webrtc…', 'wait');
    // STUN may be blocked on intranet; rely on host candidates only.
    pc = new RTCPeerConnection({ iceServers: [] });

    pc.onicecandidate = ev => {
      if (ev.candidate) log('local cand:', ev.candidate.candidate.split(' ').slice(0,7).join(' '));
    };
    pc.oniceconnectionstatechange = () => {
      log('ice:', pc.iceConnectionState);
      const ok = ['connected', 'completed'].includes(pc.iceConnectionState);
      const bad = ['failed', 'disconnected', 'closed'].includes(pc.iceConnectionState);
      setConn(pc.iceConnectionState, ok ? 'ok' : bad ? 'bad' : 'wait');
    };
    pc.onconnectionstatechange = () => log('pc state:', pc.connectionState);

    dc = pc.createDataChannel('stats');
    dc.onopen = () => { log('dc open'); try { dc.send('hello from client'); } catch(_){} };
    dc.onmessage = ev => {
      try {
        const m = JSON.parse(ev.data);
        if (m.type === 'stats') {
          $('s_frames').textContent = m.frames;
          $('s_fps').textContent = m.server_fps;
          $('s_shape').textContent = m.shape ? m.shape.join('×') : '—';
          $('s_elapsed').textContent = m.elapsed_s + ' s';
        }
      } catch (e) { log('dc msg parse fail:', e.message); }
    };

    localStream.getTracks().forEach(t => {
      log('adding track:', t.kind, t.label);
      pc.addTrack(t, localStream);
    });

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    log('local SDP set, gathering ICE (max 1.5s)…');

    // Don't wait forever — send the offer even if gathering hasn't completed.
    // The server can accept additional candidates later (trickle), but our
    // server doesn't implement that, so we just timeout and send what we have.
    await Promise.race([
      new Promise(r => {
        if (pc.iceGatheringState === 'complete') return r();
        pc.onicegatheringstatechange = () => { if (pc.iceGatheringState === 'complete') r(); };
      }),
      new Promise(r => setTimeout(r, 1500)),
    ]);
    log('ice gathering state:', pc.iceGatheringState, '(sending offer)');

    const resp = await fetch('/offer', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
    });
    if (!resp.ok) throw new Error(`offer POST ${resp.status}`);
    const ans = await resp.json();
    await pc.setRemoteDescription(ans);
    log('answer applied');
    $('stop').disabled = false;
  } catch (e) {
    log('webrtc setup error:', e.name, e.message);
    setConn('error', 'bad');
    try { pc && pc.close(); } catch(_){}
    pc = null;
    if (localStream) { localStream.getTracks().forEach(t=>t.stop()); localStream=null; $('local').srcObject=null; }
    resetButtons();
  }
}

async function stop() {
  log('stopping…');
  $('stop').disabled = true;
  try { dc && dc.close(); } catch(_){}
  try { pc && pc.close(); } catch(_){}
  dc = null; pc = null;
  if (localStream) { localStream.getTracks().forEach(t=>t.stop()); localStream = null; }
  $('local').srcObject = null;
  $('t_local').textContent = '—';
  $('s_frames').textContent = '—';
  $('s_fps').textContent = '—';
  $('s_shape').textContent = '—';
  $('s_elapsed').textContent = '—';
  setConn('stopped');
  $('start').disabled = false;
}
</script>
</body>
</html>
