<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>lingbot-map realtime point cloud</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #eee; font: 13px/1.4 system-ui, sans-serif; height: 100%; }
  #canvas { position: fixed; inset: 0; }
  header { position: fixed; top: 0; left: 0; right: 0; padding: 6px 12px; background: rgba(0,0,0,0.6); display: flex; gap: 12px; align-items: center; z-index: 5; }
  header h1 { font-size: 13px; margin: 0; opacity: 0.8; }
  .stats { position: fixed; bottom: 0; left: 0; right: 0; padding: 6px 12px; background: rgba(0,0,0,0.6); display: flex; gap: 18px; flex-wrap: wrap; z-index: 5; font-size: 12px; }
  .stats span { opacity: 0.7; }
  .stats b { color: #fff; font-weight: 600; margin-left: 4px; }
  .badge { padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-left: auto; }
  .badge.ok { background: #2a7a2a; }
  .badge.bad { background: #7a2a2a; }
  .badge.idle { background: #555; }
  .badge.wait { background: #7a6a2a; }
  button { padding: 4px 10px; font-size: 12px; background: #333; color: #eee; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
  .help { position: fixed; top: 40px; right: 10px; background: rgba(0,0,0,0.7); padding: 6px 10px; border-radius: 4px; font-size: 11px; opacity: 0.7; z-index: 5; max-width: 200px; }
  .bim-panel { position: fixed; top: 44px; left: 10px; background: rgba(0,0,0,0.75); padding: 10px 12px; border-radius: 6px; font-size: 12px; z-index: 5; min-width: 240px; }
  .bim-panel h3 { margin: 0 0 8px 0; font-size: 12px; opacity: .85; display: flex; justify-content: space-between; align-items: center; }
  .bim-panel .row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .bim-panel .row label { width: 50px; opacity: .75; }
  .bim-panel input[type=range] { flex: 1; }
  .bim-panel input[type=number] { width: 56px; background: #222; color: #eee; border: 1px solid #444; padding: 2px 4px; border-radius: 3px; font-size: 11px; }
  .bim-panel select, .bim-panel button { font-size: 11px; }
  .bim-panel input[type=file] { display: none; }
  .bim-panel .bim-file-btn { padding: 3px 8px; background: #2a4a7a; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<header>
  <h1>lingbot-map · realtime 3D</h1>
  <button id="reset">시점 초기화</button>
  <button id="clear">점군 비우기</button>
  <button id="toggleCams">카메라 숨기기</button>
  <button id="toggleThumbs">썸네일 숨기기</button>
  <label style="font-size:12px;opacity:.8">점크기
    <input type="range" id="psize" min="0.001" max="0.05" step="0.001" value="0.01" style="vertical-align:middle;width:80px">
  </label>
  <select id="picker" style="background:#222;color:#eee;border:1px solid #555;padding:3px 6px;border-radius:4px;font-size:12px;max-width:280px">
    <option value="">📜 업로드 선택…</option>
  </select>
  <span id="ws_badge" class="badge idle">WS 대기</span>
</header>
<div class="help">drag: 회전 · wheel: 줌 · shift+drag: 이동</div>
<div class="bim-panel" id="bim_panel">
  <h3>
    🏗️ BIM 오버레이
    <span><label class="bim-file-btn" style="cursor:pointer;border:1px solid #555;border-radius:3px">
      ＋업로드<input type="file" id="bim_file" accept=".glb,.gltf,.obj"></label></span>
  </h3>
  <div class="row">
    <select id="bim_picker" style="flex:1;background:#222;color:#eee;border:1px solid #555;padding:3px 6px;border-radius:4px;">
      <option value="">— 모델 선택 —</option>
    </select>
    <button id="bim_delete" title="선택된 BIM 삭제" style="padding:3px 6px;background:#7a2a2a">🗑</button>
  </div>
  <div class="row"><label>표시</label>
    <input type="checkbox" id="bim_visible" checked>
    <label style="width:auto">투명도</label>
    <input type="range" id="bim_opacity" min="0.05" max="1" step="0.05" value="0.5">
  </div>
  <div class="row"><label>Wireframe</label>
    <input type="checkbox" id="bim_wire">
    <label style="width:auto;margin-left:8px">자동맞춤</label>
    <button id="bim_fit" style="padding:2px 6px">🎯 점군에 맞춤</button>
  </div>
  <div class="row"><label>TX</label><input type="range" id="bim_tx" min="-10" max="10" step="0.01" value="0"><input type="number" id="bim_tx_n" step="0.01" value="0"></div>
  <div class="row"><label>TY</label><input type="range" id="bim_ty" min="-10" max="10" step="0.01" value="0"><input type="number" id="bim_ty_n" step="0.01" value="0"></div>
  <div class="row"><label>TZ</label><input type="range" id="bim_tz" min="-10" max="10" step="0.01" value="0"><input type="number" id="bim_tz_n" step="0.01" value="0"></div>
  <div class="row"><label>RX°</label><input type="range" id="bim_rx" min="-180" max="180" step="1" value="0"><input type="number" id="bim_rx_n" step="1" value="0"></div>
  <div class="row"><label>RY°</label><input type="range" id="bim_ry" min="-180" max="180" step="1" value="0"><input type="number" id="bim_ry_n" step="1" value="0"></div>
  <div class="row"><label>RZ°</label><input type="range" id="bim_rz" min="-180" max="180" step="1" value="0"><input type="number" id="bim_rz_n" step="1" value="0"></div>
  <div class="row"><label>Scale</label><input type="range" id="bim_scale" min="0.01" max="20" step="0.01" value="1"><input type="number" id="bim_scale_n" step="0.01" value="1"></div>
  <div class="row" style="opacity:.6;font-size:11px"><span id="bim_status">대기</span></div>
  <hr style="border:0;border-top:1px solid #333;margin:8px 0">
  <h3 style="margin:0 0 6px 0;font-size:12px;opacity:.85">🎯 대응점 정합</h3>
  <div class="row" style="font-size:11px;opacity:.7;line-height:1.3;display:block;margin-bottom:4px">
    Shift+클릭으로 점군과 BIM 짝짓기 (≥3쌍). 점군 먼저, 그 다음 같은 위치의 BIM 클릭.
  </div>
  <div class="row">
    <span>수집:<b id="cor_count" style="margin-left:4px">0</b>쌍</span>
    <span style="margin-left:8px">대기:<b id="cor_pending" style="margin-left:4px">—</b></span>
  </div>
  <div class="row">
    <button id="cor_solve" style="background:#2a7a2a;flex:1">🧮 정합 계산 & 적용</button>
    <button id="cor_clear" title="대응점 모두 삭제">↺</button>
    <button id="cor_undo" title="마지막 항목 삭제">⌫</button>
  </div>
  <div class="row" style="opacity:.7;font-size:11px"><span id="cor_status">대기</span></div>
</div>
<div class="stats">
  <span>WS<b id="s_ws">—</b></span>
  <span>점<b id="s_pts">0</b></span>
  <span>카메라<b id="s_cams">0</b></span>
  <span>마지막<b id="s_age">—</b></span>
  <span>FPS<b id="s_fps">—</b></span>
  <span>서버<b id="s_server">—</b></span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

const $ = id => document.getElementById(id);
const canvas = $('canvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias: false});
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
// Convert sRGB byte → linear so vertex colors match sRGB-tagged textures.
function srgbToLinear(c) {
  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
}
const _srgbLut = new Float32Array(256);
for (let i = 0; i < 256; i++) _srgbLut[i] = srgbToLinear(i / 255);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.01, 1000);
camera.position.set(0, 0, 4);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
scene.add(new THREE.AxesHelper(0.5));
scene.add(new THREE.GridHelper(20, 20, 0x333333, 0x222222));

const MAX_POINTS = 2_000_000;
const positions = new Float32Array(MAX_POINTS * 3);
const colors = new Float32Array(MAX_POINTS * 3);
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
geom.setDrawRange(0, 0);
// world-unit point size (sizeAttenuation true) → closer points appear bigger,
// matching demo's viser viewer. Updated dynamically from scene span.
let pointSize = 0.01;
function makeCircleTex() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32,32,8, 32,32,30);
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.7, 'rgba(255,255,255,1)');
  g.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(32,32,32,0,Math.PI*2); ctx.fill();
  return new THREE.CanvasTexture(c);
}
const pointTex = makeCircleTex();
const mat = new THREE.PointsMaterial({
  size: pointSize, vertexColors: true, sizeAttenuation: true,
  map: pointTex, alphaTest: 0.4, transparent: true, depthWrite: true,
});
const points = new THREE.Points(geom, mat);
scene.add(points);
let usedPoints = 0;
let bounds = null;  // {min:[x,y,z], max:[x,y,z]}

const camGroup = new THREE.Group();
scene.add(camGroup);
let camCount = 0;
let meshObj = null;   // LBM1 mesh; replaces the point cloud when present

function installMesh(verts, vrgb, faces) {
  // OpenCV → Three.js: flip Y and Z in vertex positions.
  const V = verts.length / 3;
  const pos = new Float32Array(verts.length);
  const col = new Float32Array(verts.length);
  let mn = [verts[0], -verts[1], -verts[2]];
  let mx = [verts[0], -verts[1], -verts[2]];
  for (let i = 0; i < V; i++) {
    const x = verts[i*3], y = -verts[i*3+1], z = -verts[i*3+2];
    pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = z;
    if (x<mn[0]) mn[0]=x; if (y<mn[1]) mn[1]=y; if (z<mn[2]) mn[2]=z;
    if (x>mx[0]) mx[0]=x; if (y>mx[1]) mx[1]=y; if (z>mx[2]) mx[2]=z;
    col[i*3]   = _srgbLut[vrgb[i*3]];
    col[i*3+1] = _srgbLut[vrgb[i*3+1]];
    col[i*3+2] = _srgbLut[vrgb[i*3+2]];
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setIndex(new THREE.BufferAttribute(faces.slice(), 1));
  g.computeVertexNormals();
  const mat = new THREE.MeshLambertMaterial({
    vertexColors: true, side: THREE.DoubleSide, flatShading: false,
  });
  if (meshObj) { scene.remove(meshObj); meshObj.geometry.dispose(); }
  meshObj = new THREE.Mesh(g, mat);
  scene.add(meshObj);
  // Add basic lighting if not present
  if (!scene.userData.lit) {
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dir = new THREE.DirectionalLight(0xffffff, 0.8);
    dir.position.set(1, 2, 1); scene.add(dir);
    scene.userData.lit = true;
  }
  bounds = {min: mn, max: mx};
  $('s_pts').textContent = V.toLocaleString() + ' verts';
}

let camScale = 0.03;
let thumbsVisible = true;
const frustumMat = new THREE.LineBasicMaterial({color: 0x44ddff, transparent: true, opacity: 0.18});
const trajPositions = [];
const trajGeom = new THREE.BufferGeometry();
const trajMat = new THREE.LineBasicMaterial({color: 0xffaa33, transparent: true, opacity: 0.7});
const trajLine = new THREE.Line(trajGeom, trajMat);
scene.add(trajLine);

function addCameraFrustum(c2w, K, scale=camScale, thumbTex=null) {
  // OpenCV → Three.js: M = diag(1,-1,-1). Transform c2w as M @ c2w @ M.
  // R'[i,j] = sign[i]*sign[j]*R[i,j] where sign=[1,-1,-1]; t'[i] = sign[i]*t[i].
  // Row-major 3x4: indices [0..2]=row0, [3]=t[0], [4..6]=row1, [7]=t[1], [8..10]=row2, [11]=t[2]
  const R00=c2w[0], R01=-c2w[1], R02=-c2w[2], t0= c2w[3];
  const R10=-c2w[4], R11= c2w[5], R12= c2w[6], t1=-c2w[7];
  const R20=-c2w[8], R21= c2w[9], R22= c2w[10],t2=-c2w[11];
  const m = new THREE.Matrix4();
  m.set(
    R00, R01, R02, t0,
    R10, R11, R12, t1,
    R20, R21, R22, t2,
    0, 0, 0, 1
  );
  const h = scale, w = scale*0.7;
  // Frustum opens toward -Z (camera forward in Three.js after M transform)
  const verts = new Float32Array([
    0,0,0,  w, h,-scale,
    0,0,0, -w, h,-scale,
    0,0,0,  w,-h,-scale,
    0,0,0, -w,-h,-scale,
     w, h,-scale,  w,-h,-scale,
     w,-h,-scale, -w,-h,-scale,
    -w,-h,-scale, -w, h,-scale,
    -w, h,-scale,  w, h,-scale,
  ]);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  const group = new THREE.Group();
  const line = new THREE.LineSegments(g, frustumMat);
  group.add(line);
  if (thumbTex) {
    const planeGeom = new THREE.PlaneGeometry(w*1.8, h*1.8);
    const planeMat = new THREE.MeshBasicMaterial({
      map: thumbTex, side: THREE.DoubleSide, transparent: true,
      opacity: 0.55, depthWrite: false,
    });
    const plane = new THREE.Mesh(planeGeom, planeMat);
    plane.userData.isThumb = true;
    plane.visible = thumbsVisible;
    plane.position.set(0, 0, -scale);
    group.add(plane);
  }
  group.applyMatrix4(m);
  camGroup.add(group);
  camCount++;
  trajPositions.push(t0, t1, t2);  // already M-transformed
  trajGeom.setAttribute('position', new THREE.Float32BufferAttribute(trajPositions, 3));
  trajGeom.computeBoundingSphere();
}

function fitView() {
  if (!bounds) return;
  const cx = (bounds.min[0] + bounds.max[0]) / 2;
  const cy = (bounds.min[1] + bounds.max[1]) / 2;
  const cz = (bounds.min[2] + bounds.max[2]) / 2;
  const dx = bounds.max[0] - bounds.min[0];
  const dy = bounds.max[1] - bounds.min[1];
  const dz = bounds.max[2] - bounds.min[2];
  const span = Math.max(dx, dy, dz, 0.5);
  camera.position.set(cx + span*0.8, cy + span*0.6, cz + span*1.2);
  controls.target.set(cx, cy, cz);
  controls.update();
}

function replacePoints(xyz, rgb) {
  // Replace mode: overwrite the entire point cloud and recompute bounds.
  // OpenCV world → Three.js: M = diag(1,-1,-1): flip Y (down→up) and Z (forward→back).
  const n = Math.min(xyz.length / 3, MAX_POINTS);
  if (n === 0) { usedPoints = 0; geom.setDrawRange(0, 0); return 0; }
  let mn = [xyz[0], -xyz[1], -xyz[2]];
  let mx = [xyz[0], -xyz[1], -xyz[2]];
  for (let i = 0; i < n; i++) {
    const x = xyz[i*3], y = -xyz[i*3+1], z = -xyz[i*3+2];
    positions[i*3+0] = x; positions[i*3+1] = y; positions[i*3+2] = z;
    if (x<mn[0]) mn[0]=x; if (y<mn[1]) mn[1]=y; if (z<mn[2]) mn[2]=z;
    if (x>mx[0]) mx[0]=x; if (y>mx[1]) mx[1]=y; if (z>mx[2]) mx[2]=z;
    colors[i*3+0] = _srgbLut[rgb[i*3+0]];
    colors[i*3+1] = _srgbLut[rgb[i*3+1]];
    colors[i*3+2] = _srgbLut[rgb[i*3+2]];
  }
  bounds = {min: mn, max: mx};
  usedPoints = n;
  geom.attributes.position.needsUpdate = true;
  geom.attributes.color.needsUpdate = true;
  geom.setDrawRange(0, usedPoints);
  geom.computeBoundingSphere();

  // auto camera-frustum scale based on scene extent (frustum is in world units).
  // Point size is in screen pixels (sizeAttenuation=false) — no rescale needed.
  const dx = mx[0]-mn[0], dy = mx[1]-mn[1], dz = mx[2]-mn[2];
  const span = Math.max(dx, dy, dz, 0.3);
  // Tie frustum size to cam_span (not pts_span) so cameras don't overwhelm
  // small phone-motion paths. We approximate cam_span as 1/4 of pts_span here.
  const newCam = Math.max(0.01, span * 0.012);
  if (Math.abs(newCam - camScale)/camScale > 0.3) camScale = newCam;
  // Adapt world-unit point size to scene scale: ~0.3% of span — bigger points
  // overlap visually so the cloud reads as a surface, not isolated dots.
  const newPt = Math.max(0.003, span * 0.003);
  if (!userSetPointSize) { pointSize = newPt; mat.size = pointSize;
    $('psize').value = pointSize.toFixed(3); }
  return n;
}
let userSetPointSize = false;

$('reset').onclick = fitView;
$('toggleCams').onclick = () => {
  camGroup.visible = !camGroup.visible;
  trajLine.visible = camGroup.visible;
  $('toggleCams').textContent = camGroup.visible ? '카메라 숨기기' : '카메라 보이기';
};
$('toggleThumbs').onclick = () => {
  thumbsVisible = !thumbsVisible;
  camGroup.traverse(o => { if (o.userData && o.userData.isThumb) o.visible = thumbsVisible; });
  $('toggleThumbs').textContent = thumbsVisible ? '썸네일 숨기기' : '썸네일 보이기';
};
$('psize').oninput = e => {
  pointSize = parseFloat(e.target.value);
  mat.size = pointSize;
  userSetPointSize = true;
};
$('clear').onclick = () => {
  usedPoints = 0;
  geom.setDrawRange(0, 0);
  while (camGroup.children.length) camGroup.remove(camGroup.children[0]);
  camCount = 0;
  trajPositions.length = 0;
  trajGeom.setAttribute('position', new THREE.Float32BufferAttribute([], 3));
  bounds = null;
  $('s_pts').textContent = '0';
  $('s_cams').textContent = '0';
};
// auto-fit on first payload
let firstPayload = true;
let latestThumbs = [];  // THREE.Texture per frame, sent via JSON sidecar

// ---- Upload picker: list past uploads and replay on select ----
async function loadPicker() {
  try {
    const r = await fetch('/api/uploads').then(r => r.json());
    const items = r.uploads || [];
    const sel = $('picker');
    while (sel.options.length > 1) sel.remove(1);
    for (const it of items) {
      const when = new Date(it.ts_ms).toLocaleString('ko-KR', {hour12:false});
      const opt = document.createElement('option');
      opt.value = it.id;
      opt.textContent = `${when} · ${it.video || it.id}`;
      sel.appendChild(opt);
    }
  } catch (e) { console.warn('picker load failed', e); }
}
$('picker').addEventListener('change', async e => {
  const id = e.target.value;
  if (!id) return;
  firstPayload = true;       // refit on the replayed payload
  try {
    await fetch(`/api/uploads/${id}/replay`, {method: 'POST'});
  } catch (err) {
    console.warn('replay failed', err);
  }
});
loadPicker();

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// ---- WebSocket ----
let lastMsgTs = 0, msgCount = 0, fpsT = performance.now(), fpsN = 0;
function wsUrl() {
  const p = location.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${p}//${location.host}/ws`;
}
function connectWs() {
  const ws = new WebSocket(wsUrl());
  ws.binaryType = 'arraybuffer';
  $('s_ws').textContent = 'connecting';
  $('ws_badge').textContent = 'WS 연결중';
  $('ws_badge').className = 'badge wait';
  ws.onopen = () => {
    $('s_ws').textContent = 'open';
    $('ws_badge').textContent = 'WS open';
    $('ws_badge').className = 'badge ok';
  };
  ws.onclose = () => {
    $('s_ws').textContent = 'closed (재연결 1s)';
    $('ws_badge').textContent = 'WS 끊김';
    $('ws_badge').className = 'badge bad';
    setTimeout(connectWs, 1000);
  };
  ws.onerror = e => { $('s_ws').textContent = 'error'; };
  ws.onmessage = ev => {
    if (typeof ev.data === 'string') {
      // JSON sidecars: {type:"thumbs", images:[b64...]} or {type:"ping"}
      try {
        const j = JSON.parse(ev.data);
        if (j.type === 'thumbs' && Array.isArray(j.images)) {
          latestThumbs = j.images.map(b64 => {
            const img = new Image();
            img.src = 'data:image/jpeg;base64,' + b64;
            const tex = new THREE.Texture(img);
            tex.colorSpace = THREE.SRGBColorSpace;
            img.onload = () => { tex.needsUpdate = true; };
            return tex;
          });
          console.log('[viewer] thumbs received:', latestThumbs.length);
        }
      } catch {}
      return;
    }
    const buf = new DataView(ev.data);
    const magic = String.fromCharCode(buf.getUint8(0), buf.getUint8(1), buf.getUint8(2), buf.getUint8(3));
    console.log('[viewer] WS payload', ev.data.byteLength, 'bytes magic=', magic);
    if (magic === 'LBP2') {
      const flags   = buf.getUint32(4, true);
      const numPts  = buf.getUint32(8, true);
      const numPoses= buf.getUint32(12, true);
      const seq     = buf.getUint32(16, true);
      let off = 20;
      const xyz = new Float32Array(ev.data, off, numPts*3); off += numPts*3*4;
      const rgb = new Uint8Array(ev.data, off, numPts*3); off += numPts*3;
      const posesBytes = numPoses*12*4;
      const poses = new Float32Array(ev.data.slice(off, off + posesBytes)); off += posesBytes;
      const K = new Float32Array(ev.data.slice(off, off + 9*4)); off += 9*4;
      // replace_all
      while (camGroup.children.length) camGroup.remove(camGroup.children[0]);
      if (meshObj) { scene.remove(meshObj); meshObj.geometry.dispose(); meshObj = null; }
      camCount = 0;
      trajPositions.length = 0;
      replacePoints(xyz, rgb);
      for (let i = 0; i < numPoses; i++) {
        addCameraFrustum(poses.subarray(i*12, (i+1)*12), K, camScale, latestThumbs[i] || null);
      }
    } else if (magic === 'LBM1') {
      // Mesh: header(24B) + verts f32(V*3) + rgb u8(V*3) + faces u32(F*3) + poses f32(N*12) + K f32(9)
      const flags   = buf.getUint32(4, true);
      const numV    = buf.getUint32(8, true);
      const numF    = buf.getUint32(12, true);
      const numPoses= buf.getUint32(16, true);
      const seq     = buf.getUint32(20, true);
      let off = 24;
      const verts = new Float32Array(ev.data, off, numV*3); off += numV*3*4;
      const vrgb  = new Uint8Array(ev.data, off, numV*3); off += numV*3;
      const faces = new Uint32Array(ev.data.slice(off, off + numF*3*4)); off += numF*3*4;
      const posesBytes = numPoses*12*4;
      const poses = new Float32Array(ev.data.slice(off, off + posesBytes)); off += posesBytes;
      const K = new Float32Array(ev.data.slice(off, off + 9*4)); off += 9*4;
      while (camGroup.children.length) camGroup.remove(camGroup.children[0]);
      camCount = 0;
      trajPositions.length = 0;
      // Clear point cloud + add mesh
      usedPoints = 0; geom.setDrawRange(0, 0);
      installMesh(verts, vrgb, faces);
      for (let i = 0; i < numPoses; i++) {
        addCameraFrustum(poses.subarray(i*12, (i+1)*12), K, camScale, latestThumbs[i] || null);
      }
    } else {
      console.warn('unknown magic', magic); return;
    }
    if (bounds) fitView();
    firstPayload = false;
    lastMsgTs = Date.now();
    msgCount++; fpsN++;
    $('s_pts').textContent = usedPoints.toLocaleString();
    $('s_cams').textContent = camCount;
  };
}
// ───────────────────────── BIM overlay ─────────────────────────
const bimGroup = new THREE.Group();
scene.add(bimGroup);
let bimRoot = null;        // currently-loaded model root
let bimMaterials = [];     // collected from the loaded model for opacity/wireframe tweaks

const bimTransform = { tx:0, ty:0, tz:0, rx:0, ry:0, rz:0, scale:1, opacity:0.5, visible:true, wire:false };

function applyBimTransform() {
  if (!bimRoot) return;
  bimRoot.position.set(bimTransform.tx, bimTransform.ty, bimTransform.tz);
  bimRoot.rotation.set(
    bimTransform.rx * Math.PI/180,
    bimTransform.ry * Math.PI/180,
    bimTransform.rz * Math.PI/180,
  );
  bimRoot.scale.setScalar(bimTransform.scale);
  bimRoot.visible = bimTransform.visible;
  for (const m of bimMaterials) {
    m.transparent = bimTransform.opacity < 1;
    m.opacity = bimTransform.opacity;
    m.wireframe = bimTransform.wire;
    m.depthWrite = bimTransform.opacity >= 0.95;
    m.needsUpdate = true;
  }
}

function disposeBim() {
  if (!bimRoot) return;
  bimGroup.remove(bimRoot);
  bimRoot.traverse(o => {
    if (o.isMesh) {
      o.geometry?.dispose();
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) m?.dispose?.();
    }
  });
  bimRoot = null;
  bimMaterials = [];
}

async function loadBimById(id) {
  if (!id) { disposeBim(); return; }
  $('bim_status').textContent = '로딩 중…';
  // determine extension via /api/bim/list lookup
  const list = await fetch('/api/bim/list').then(r => r.json()).catch(() => ({bim:[]}));
  const meta = (list.bim || []).find(b => b.id === id);
  if (!meta) { $('bim_status').textContent = '메타데이터 누락'; return; }
  const url = `/api/bim/${id}/file`;
  try {
    let obj;
    if (meta.ext === '.glb' || meta.ext === '.gltf') {
      const loader = new GLTFLoader();
      const gltf = await new Promise((res, rej) => loader.load(url, res, undefined, rej));
      obj = gltf.scene;
    } else if (meta.ext === '.obj') {
      const loader = new OBJLoader();
      obj = await new Promise((res, rej) => loader.load(url, res, undefined, rej));
    } else {
      $('bim_status').textContent = `미지원 확장자: ${meta.ext}`;
      return;
    }
    disposeBim();
    bimRoot = obj;
    bimGroup.add(bimRoot);
    bimMaterials = [];
    bimRoot.traverse(o => {
      if (o.isMesh) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of mats) if (m) bimMaterials.push(m);
      }
    });
    applyBimTransform();
    $('bim_status').textContent = `로드 완료 (${meta.file}, ${(meta.bytes/1e6).toFixed(1)} MB)`;
  } catch (e) {
    console.error('BIM load failed', e);
    $('bim_status').textContent = `로드 실패: ${e.message || e}`;
  }
}

async function refreshBimList() {
  const r = await fetch('/api/bim/list').then(r => r.json()).catch(() => ({bim:[]}));
  const sel = $('bim_picker');
  while (sel.options.length > 1) sel.remove(1);
  for (const b of (r.bim || [])) {
    const opt = document.createElement('option');
    opt.value = b.id;
    const when = new Date(b.ts_ms).toLocaleString('ko-KR', {hour12:false});
    opt.textContent = `${when} · ${b.file}`;
    sel.appendChild(opt);
  }
}

// Sync paired range+number inputs
function pairCtrl(idRange, idNum, key, onChange) {
  const r = $(idRange), n = $(idNum);
  const set = (v) => {
    bimTransform[key] = v; r.value = v; n.value = v; applyBimTransform();
    if (onChange) onChange();
  };
  r.addEventListener('input', e => set(parseFloat(e.target.value)));
  n.addEventListener('input', e => set(parseFloat(e.target.value)));
}
pairCtrl('bim_tx','bim_tx_n','tx');
pairCtrl('bim_ty','bim_ty_n','ty');
pairCtrl('bim_tz','bim_tz_n','tz');
pairCtrl('bim_rx','bim_rx_n','rx');
pairCtrl('bim_ry','bim_ry_n','ry');
pairCtrl('bim_rz','bim_rz_n','rz');
pairCtrl('bim_scale','bim_scale_n','scale');

$('bim_opacity').addEventListener('input', e => {
  bimTransform.opacity = parseFloat(e.target.value); applyBimTransform();
});
$('bim_visible').addEventListener('change', e => {
  bimTransform.visible = e.target.checked; applyBimTransform();
});
$('bim_wire').addEventListener('change', e => {
  bimTransform.wire = e.target.checked; applyBimTransform();
});
$('bim_picker').addEventListener('change', e => loadBimById(e.target.value));
$('bim_delete').addEventListener('click', async () => {
  const id = $('bim_picker').value;
  if (!id) return;
  if (!confirm(`BIM 삭제: ${id}?`)) return;
  await fetch(`/api/bim/${id}`, {method:'DELETE'});
  disposeBim();
  await refreshBimList();
  $('bim_picker').value = '';
});
$('bim_file').addEventListener('change', async e => {
  const f = e.target.files?.[0];
  if (!f) return;
  $('bim_status').textContent = `업로드 중… (${(f.size/1e6).toFixed(1)} MB)`;
  const fd = new FormData(); fd.append('file', f);
  const r = await fetch('/api/bim/upload', {method:'POST', body:fd}).then(r => r.json()).catch(e => ({ok:false, error:e}));
  if (!r.ok) { $('bim_status').textContent = `업로드 실패: ${r.error}`; return; }
  await refreshBimList();
  $('bim_picker').value = r.id;
  await loadBimById(r.id);
  e.target.value = '';
});
$('bim_fit').addEventListener('click', () => {
  // Center BIM bounding box on the current point-cloud centroid and scale to match span.
  if (!bimRoot || !bounds) { $('bim_status').textContent = '점군 또는 BIM 없음'; return; }
  const bbox = new THREE.Box3().setFromObject(bimRoot);
  const bimSize = bbox.getSize(new THREE.Vector3());
  const bimCenter = bbox.getCenter(new THREE.Vector3());
  const ptsSize = new THREE.Vector3(
    bounds.max[0]-bounds.min[0], bounds.max[1]-bounds.min[1], bounds.max[2]-bounds.min[2]);
  const ptsCenter = new THREE.Vector3(
    (bounds.min[0]+bounds.max[0])/2, (bounds.min[1]+bounds.max[1])/2, (bounds.min[2]+bounds.max[2])/2);
  const targetSpan = Math.max(ptsSize.x, ptsSize.y, ptsSize.z);
  const bimSpan = Math.max(bimSize.x, bimSize.y, bimSize.z, 1e-6);
  // Reset to identity first so bbox computation is in model-local space
  bimTransform.scale = targetSpan / bimSpan;
  // After scaling, translate so scaled center sits on point centroid
  bimTransform.tx = ptsCenter.x - bimCenter.x * bimTransform.scale;
  bimTransform.ty = ptsCenter.y - bimCenter.y * bimTransform.scale;
  bimTransform.tz = ptsCenter.z - bimCenter.z * bimTransform.scale;
  bimTransform.rx = bimTransform.ry = bimTransform.rz = 0;
  // Sync UI
  for (const [k, prefix] of [['tx','bim_tx'],['ty','bim_ty'],['tz','bim_tz'],
                             ['rx','bim_rx'],['ry','bim_ry'],['rz','bim_rz'],['scale','bim_scale']]) {
    $(prefix).value = bimTransform[k];
    $(prefix+'_n').value = bimTransform[k];
  }
  applyBimTransform();
  $('bim_status').textContent = `자동맞춤: scale=${bimTransform.scale.toFixed(3)}`;
});

// Initial fetch
refreshBimList();

// ───────────────────────── Correspondence picking ─────────────────────────
// User Shift+clicks a scan point, then Shift+clicks the matching BIM point.
// >=3 pairs → POST /api/bim/align → apply returned (s,R,t) to bimTransform.
// World-space BIM clicks are converted to BIM-local via the current transform inverse.
const correspondences = [];  // [{scan:[x,y,z], bim:[x,y,z]}]
let pendingScan = null;      // last unmatched scan point
const corMarkers = new THREE.Group();
scene.add(corMarkers);

const raycaster = new THREE.Raycaster();
raycaster.params.Points = { threshold: 0.05 };  // world-units near a point
const ndc = new THREE.Vector2();

function makeMarker(color, pos) {
  const g = new THREE.SphereGeometry(0.02, 12, 8);
  const m = new THREE.MeshBasicMaterial({ color, depthTest: false, transparent: true, opacity: 0.9 });
  const s = new THREE.Mesh(g, m);
  s.position.copy(pos);
  s.renderOrder = 999;
  return s;
}

function updateCorUi() {
  $('cor_count').textContent = correspondences.length;
  $('cor_pending').textContent = pendingScan ? `점군 (${pendingScan.map(v=>v.toFixed(2)).join(',')})` : '—';
}

canvas.addEventListener('pointerdown', (e) => {
  if (!e.shiftKey) return;  // only Shift+click triggers picking
  const rect = canvas.getBoundingClientRect();
  ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);

  if (pendingScan === null) {
    // Pick on scan geometry — points (geom) or mesh (meshObj)
    let hit = null;
    const ptHits = raycaster.intersectObject(points, false);
    if (ptHits.length) hit = ptHits[0];
    if (meshObj) {
      const mHits = raycaster.intersectObject(meshObj, false);
      if (mHits.length && (!hit || mHits[0].distance < hit.distance)) hit = mHits[0];
    }
    if (!hit) { $('cor_status').textContent = '점군에서 가까운 점을 찾지 못함'; return; }
    pendingScan = [hit.point.x, hit.point.y, hit.point.z];
    corMarkers.add(makeMarker(0xffcc00, hit.point));
    $('cor_status').textContent = '이제 같은 위치의 BIM 표면을 Shift+클릭하세요';
    updateCorUi();
  } else {
    // Pick on BIM
    if (!bimRoot) { $('cor_status').textContent = 'BIM이 로드되지 않음'; return; }
    const hits = raycaster.intersectObject(bimRoot, true);
    if (!hits.length) { $('cor_status').textContent = 'BIM에서 가까운 점을 찾지 못함'; return; }
    const wp = hits[0].point.clone();
    // Convert world-space BIM hit → BIM-local (the source frame for umeyama).
    // bimRoot world matrix is composed from bimTransform. We invert it.
    bimRoot.updateMatrixWorld(true);
    const inv = new THREE.Matrix4().copy(bimRoot.matrixWorld).invert();
    const lp = wp.clone().applyMatrix4(inv);
    correspondences.push({
      scan: pendingScan,
      bim: [lp.x, lp.y, lp.z],
    });
    corMarkers.add(makeMarker(0x00ccff, wp));
    pendingScan = null;
    $('cor_status').textContent = `${correspondences.length}쌍 수집 (≥3 필요)`;
    updateCorUi();
  }
});

function clearCorMarkers() {
  while (corMarkers.children.length) {
    const m = corMarkers.children[0];
    corMarkers.remove(m);
    m.geometry?.dispose(); m.material?.dispose();
  }
}

$('cor_clear').onclick = () => {
  correspondences.length = 0;
  pendingScan = null;
  clearCorMarkers();
  $('cor_status').textContent = '초기화';
  updateCorUi();
};
$('cor_undo').onclick = () => {
  if (pendingScan) {
    pendingScan = null;
    if (corMarkers.children.length) {
      const m = corMarkers.children.pop();
      m.geometry?.dispose(); m.material?.dispose();
    }
  } else if (correspondences.length) {
    correspondences.pop();
    // remove last two markers (scan + bim)
    for (let i = 0; i < 2 && corMarkers.children.length; i++) {
      const m = corMarkers.children.pop();
      m.geometry?.dispose(); m.material?.dispose();
    }
  }
  $('cor_status').textContent = '되돌림';
  updateCorUi();
};

$('cor_solve').onclick = async () => {
  if (correspondences.length < 3) {
    $('cor_status').textContent = `최소 3쌍 필요 (현재 ${correspondences.length})`;
    return;
  }
  if (!bimRoot) {
    $('cor_status').textContent = 'BIM이 로드되지 않음';
    return;
  }
  $('cor_status').textContent = '계산 중…';
  try {
    const r = await fetch('/api/bim/align', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ correspondences }),
    }).then(r => r.json());
    if (!r.ok) { $('cor_status').textContent = `실패: ${r.error}`; return; }
    // Apply (s, R, t) to bimRoot: y = s*R @ x + t maps BIM-local → scan world.
    // In Three.js, that's: matrix = T * R * S applied as bimRoot's local matrix.
    const s = r.scale;
    const R = r.rotation;  // 3x3 row-major
    const t = r.translation;
    // Compose into Three.js Matrix4 (column-major internally; .set takes row-major)
    const m = new THREE.Matrix4();
    m.set(
      s*R[0][0], s*R[0][1], s*R[0][2], t[0],
      s*R[1][0], s*R[1][1], s*R[1][2], t[1],
      s*R[2][0], s*R[2][1], s*R[2][2], t[2],
      0, 0, 0, 1
    );
    // Decompose to position/quaternion/scale → bimRoot
    const pos = new THREE.Vector3(); const quat = new THREE.Quaternion(); const scl = new THREE.Vector3();
    m.decompose(pos, quat, scl);
    bimRoot.position.copy(pos);
    bimRoot.quaternion.copy(quat);
    bimRoot.scale.copy(scl);
    // Sync UI sliders (rotation is shown in Euler degrees)
    const euler = new THREE.Euler().setFromQuaternion(quat, 'XYZ');
    bimTransform.tx = pos.x; bimTransform.ty = pos.y; bimTransform.tz = pos.z;
    bimTransform.rx = euler.x*180/Math.PI;
    bimTransform.ry = euler.y*180/Math.PI;
    bimTransform.rz = euler.z*180/Math.PI;
    bimTransform.scale = scl.x;   // umeyama gives uniform scale; .x == .y == .z
    for (const [k, prefix] of [['tx','bim_tx'],['ty','bim_ty'],['tz','bim_tz'],
                               ['rx','bim_rx'],['ry','bim_ry'],['rz','bim_rz'],['scale','bim_scale']]) {
      $(prefix).value = bimTransform[k];
      $(prefix+'_n').value = bimTransform[k];
    }
    // Materials already attached; just ensure they update
    for (const mat of bimMaterials) mat.needsUpdate = true;
    $('cor_status').textContent =
      `정합 완료: RMSE=${r.rmse.toFixed(3)}m · scale=${s.toFixed(3)} · ${r.quality} (${r.n}쌍)`;
  } catch (e) {
    console.error('alignment error', e);
    $('cor_status').textContent = `오류: ${e.message || e}`;
  }
};

connectWs();

setInterval(() => {
  if (lastMsgTs) {
    const age = (Date.now() - lastMsgTs) / 1000;
    $('s_age').textContent = age.toFixed(1) + 's';
  }
  const now = performance.now();
  const dt = (now - fpsT) / 1000;
  if (dt > 0) $('s_fps').textContent = (fpsN/dt).toFixed(1);
  fpsT = now; fpsN = 0;
  fetch('/health').then(r=>r.json()).then(h => {
    $('s_server').textContent = `${h.frames_received} fr · ${h.viewers}v · model=${h.model_loaded?'OK':'-'}`;
  }).catch(()=>{});
}, 1000);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
